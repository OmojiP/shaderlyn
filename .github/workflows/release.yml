name: Release

# タグの push だけで動かす。手動実行を許すと、選んだブランチの中身に入力したバージョン番号を付けて
# 配ることができてしまい、配布物とタグの中身が食い違う。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 各プラットフォーム向けのバイナリを作る。
  #
  # Native AOT はクロスコンパイルできない。
  # ネイティブのリンカとシステムライブラリを使うため、
  # 対象の OS と同じ OS のランナーでビルドする必要がある。
  # 1 つのジョブで全プラットフォーム分を作ることはできない。
  # ------------------------------------------------------------------
  build:
    name: ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            archive: tar.gz
            platform: linux
            vscode-target: linux-x64
          - os: ubuntu-24.04-arm
            runtime: linux-arm64
            archive: tar.gz
            platform: linux
            vscode-target: linux-arm64
          - os: windows-latest
            runtime: win-x64
            archive: zip
            platform: win32
            vscode-target: win32-x64
          # Native AOT はクロスコンパイルできないので、arm64 の Windows のランナーで組む。
          - os: windows-11-arm
            runtime: win-arm64
            archive: zip
            platform: win32
            vscode-target: win32-arm64
          # Intel の mac は macos-13 が 2025-12-04 に廃止された。
          # 公開リポジトリの標準ランナーで Intel なのは macos-15-intel と macos-26-intel だけである。
          - os: macos-26-intel
            runtime: osx-x64
            archive: tar.gz
            platform: darwin
            vscode-target: darwin-x64
          - os: macos-latest
            runtime: osx-arm64
            archive: tar.gz
            platform: darwin
            vscode-target: darwin-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: ネイティブツールチェーンを入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang zlib1g-dev

      - name: バージョンを決める
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          # 先頭の v を落として semver にする。
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "number=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: AOT publish
        run: >
          dotnet publish src/Shaderlyn.Cli.App/Shaderlyn.Cli.App.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --output artifacts/${{ matrix.runtime }}
          -p:Version=${{ steps.version.outputs.number }}

      - name: 動作を確認する
        shell: bash
        run: |
          set -euo pipefail

          if [ "${RUNNER_OS}" = "Windows" ]; then
            executable="artifacts/${{ matrix.runtime }}/shaderlyn.exe"
          else
            executable="artifacts/${{ matrix.runtime }}/shaderlyn"
          fi

          "${executable}" --version

          # fixture はルールごとに「それを踏むシェーダー」を置いた場所なので、
          # 指摘が出るのが正常である (終了コード 1)。
          # 確かめたいのは、AOT で組んだバイナリが解析を最後まで実行できることである。
          # 終了コード 2 (ツールの実行に失敗) だけを失敗として扱う (ci.yml と同じ)。
          set +e
          "${executable}" tests/Shaderlyn.Tests/fixtures --no-config
          code=$?
          set -e

          if [ "${code}" -ge 2 ]; then
            echo "::error::AOT で組んだバイナリの実行に失敗しました (終了コード ${code})。"
            exit 1
          fi

      # 配布物には実行ファイルだけを入れる。
      # デバッグ情報や中間生成物が混ざると、利用者が何を実行すべきか迷う。
      - name: アーカイブを作る
        shell: bash
        run: |
          set -euo pipefail

          staging="staging"
          mkdir -p "${staging}"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "artifacts/${{ matrix.runtime }}/shaderlyn.exe" "${staging}/"
          else
            cp "artifacts/${{ matrix.runtime }}/shaderlyn" "${staging}/"
          fi

          cp README.md "${staging}/"
          cp LICENSE "${staging}/"
          cp THIRD-PARTY-NOTICES.txt "${staging}/"

          name="shaderlyn-${{ matrix.runtime }}"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            # arm64 の Windows のランナーに 7z があるとは限らないので、ない場合は PowerShell で圧縮する。
            if command -v 7z > /dev/null; then
              (cd "${staging}" && 7z a "../${name}.zip" .)
            else
              pwsh -NoProfile -Command "Compress-Archive -Path ${staging}/* -DestinationPath ${name}.zip"
            fi
          else
            tar -czf "${name}.tar.gz" -C "${staging}" .
          fi

      # ------------------------------------------------------------------
      # VS Code 拡張。
      #
      # 言語サーバーも Native AOT なので、OS と CPU の組ごとに別の vsix になる。
      # vsce の --target で組を指定すると、VS Code は利用者の環境に合うものだけを受け付ける。
      # 拡張は server/<process.platform>/ の下からサーバーを探す (extension.ts)。
      # ------------------------------------------------------------------
      - name: 言語サーバーを AOT publish する
        run: >
          dotnet publish src/Shaderlyn.LanguageServer.App/Shaderlyn.LanguageServer.App.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --output artifacts/lsp-${{ matrix.runtime }}
          -p:Version=${{ steps.version.outputs.number }}

      # 言語サーバーは CLI と別の実行ファイルなので、その OS と CPU で起動してプロトコルに応えるかを確かめる。
      - name: 言語サーバーの起動を確認する
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bash tools/lsp-smoke.sh "artifacts/lsp-${{ matrix.runtime }}/shaderlyn-lsp.exe"
          else
            bash tools/lsp-smoke.sh "artifacts/lsp-${{ matrix.runtime }}/shaderlyn-lsp"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 配布物にはサーバーの実行ファイルだけを入れる。デバッグ情報は同梱しない。
      - name: 拡張を vsix にまとめる
        shell: bash
        run: |
          set -euo pipefail

          server="editors/vscode/server/${{ matrix.platform }}"
          mkdir -p "${server}"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "artifacts/lsp-${{ matrix.runtime }}/shaderlyn-lsp.exe" "${server}/"
          else
            cp "artifacts/lsp-${{ matrix.runtime }}/shaderlyn-lsp" "${server}/"
            chmod +x "${server}/shaderlyn-lsp"
          fi

          cp THIRD-PARTY-NOTICES.txt editors/vscode/

          cd editors/vscode
          npm ci

          # 拡張のバージョンは CLI と同じタグから決める。同じリリースに並ぶので、バージョンが食い違うと迷う。
          npm version "${{ steps.version.outputs.number }}" --no-git-tag-version --allow-same-version

          # 拡張はリポジトリのサブフォルダーにあるが、vsce はそれを知らずに README の相対パスを
          # リポジトリのルートから書き換える。Marketplace の画像とリンクが切れないよう、基点を渡す。
          # タグを指すので、そのバージョンの README の画像が出る。
          base="https://github.com/${GITHUB_REPOSITORY}"
          npx --yes @vscode/vsce package \
            --target "${{ matrix.vscode-target }}" \
            --baseContentUrl "${base}/blob/${{ steps.version.outputs.tag }}/editors/vscode" \
            --baseImagesUrl "${base}/raw/${{ steps.version.outputs.tag }}/editors/vscode" \
            --out "../../shaderlyn-vscode-${{ matrix.vscode-target }}.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: shaderlyn-${{ matrix.runtime }}
          path: |
            shaderlyn-${{ matrix.runtime }}.*
            shaderlyn-vscode-${{ matrix.vscode-target }}.vsix
          if-no-files-found: error

      # Visual Studio 拡張と Rider プラグインに同梱する言語サーバー。リリースの配布物には入れない (名前を lsp- で始める)。
      - uses: actions/upload-artifact@v7
        with:
          name: lsp-${{ matrix.runtime }}
          path: |
            artifacts/lsp-${{ matrix.runtime }}/shaderlyn-lsp
            artifacts/lsp-${{ matrix.runtime }}/shaderlyn-lsp.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Visual Studio 拡張 (VSIX)。
  #
  # VSSDK の VSIX を作る処理は、Visual Studio の MSBuild でしか動かない。
  # VS 2022 の MSBuild は .NET 10 SDK を解決できないので、VS 2026 の入ったランナーを使う
  # (windows-2025 は 2026-06 から VS 2026)。
  # VSIX のバージョンは vsixmanifest に書いたものになるので、タグと食い違っていないかを先に確かめる。
  # ------------------------------------------------------------------
  visualstudio:
    name: Visual Studio 拡張
    needs: build
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/download-artifact@v8
        with:
          name: lsp-win-x64
          path: artifacts/lsp-win-x64

      - uses: actions/download-artifact@v8
        with:
          name: lsp-win-arm64
          path: artifacts/lsp-win-arm64

      - name: vsixmanifest のバージョンをタグと比べる
        shell: pwsh
        run: |
          $manifest = [xml](Get-Content editors/visualstudio/Shaderlyn.VisualStudio/source.extension.vsixmanifest)
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          $expected = "${env:GITHUB_REF_NAME}".TrimStart('v')
          if ($version -ne $expected) {
            Write-Output "::error::source.extension.vsixmanifest のバージョン ($version) がタグ ($expected) と違います。"
            exit 1
          }

      # リリースの本文の先頭に置く概要 (英語、---、日本語)。NuGet への公開は取り消せないので、
      # その前のこのジョブで、書き忘れていないかを確かめる。
      - name: リリースの概要があるかを確かめる
        shell: pwsh
        run: |
          $path = "docs/releases/${env:GITHUB_REF_NAME}.md"
          if (-not (Test-Path $path)) {
            Write-Output "::error::リリースの概要 $path がありません。英語、---、日本語の順に書いてください (CONTRIBUTING の「リリースする」)。"
            exit 1
          }
          if (-not (Select-String -Path $path -Pattern '^---\s*$' -Quiet)) {
            Write-Output "::error::$path に英語と日本語を分ける --- の行がありません。"
            exit 1
          }

      - uses: microsoft/setup-msbuild@v3

      - name: VSIX を作る
        shell: pwsh
        run: |
          msbuild editors/visualstudio/Shaderlyn.VisualStudio/Shaderlyn.VisualStudio.csproj `
            -restore -p:Configuration=Release -v:minimal `
            "-p:ShaderlynServerDirectory=${{ github.workspace }}\artifacts\lsp-win-x64" `
            "-p:ShaderlynArm64ServerDirectory=${{ github.workspace }}\artifacts\lsp-win-arm64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item editors/visualstudio/Shaderlyn.VisualStudio/bin/Release/net472/Shaderlyn.VisualStudio.vsix shaderlyn-visualstudio.vsix

      - name: 言語サーバーが入っているかを確かめる
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("shaderlyn-visualstudio.vsix")
          $names = $zip.Entries | ForEach-Object FullName
          $zip.Dispose()
          foreach ($expected in 'server/shaderlyn-lsp.exe', 'server/arm64/shaderlyn-lsp.exe') {
            if ($names -notcontains $expected) { Write-Output "::error::VSIX に $expected がありません。"; exit 1 }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: shaderlyn-visualstudio
          path: shaderlyn-visualstudio.vsix
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Rider プラグイン。
  #
  # 言語サーバーが OS と CPU の組ごとに違うので、組ごとの zip を作る (Gradle の nativeVariants)。
  # JetBrains Marketplace は、plugin.xml の OS と CPU の依存から、利用者の環境に合うものを配る。
  # ------------------------------------------------------------------
  rider:
    name: Rider プラグイン
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: lsp-*
          path: native

      # artifact は実行の権限を保たないので付け直す。プラグイン側も起動の前に付け直す。
      - name: 言語サーバーを組ごとのフォルダーに並べる
        shell: bash
        run: |
          set -euo pipefail
          for dir in native/lsp-*; do
            runtime="${dir#native/lsp-}"
            mkdir -p "servers/${runtime}/server"
            cp "${dir}"/shaderlyn-lsp* "servers/${runtime}/server/"
          done
          chmod +x servers/*/server/shaderlyn-lsp 2>/dev/null || true
          ls -lR servers

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.9.0"

      # JetBrains Marketplace の審査の条件。内部 API の使用などがあれば止める。
      - name: Plugin Verifier で互換性を確認する
        working-directory: editors/rider
        run: gradle verifyPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: 組ごとの zip を作る
        working-directory: editors/rider
        run: >
          gradle buildPluginVariants
          -PpluginVersion="${GITHUB_REF_NAME#v}"
          -PnativeServerRoot="${GITHUB_WORKSPACE}/servers"

      # 言語サーバーのフォルダーが欠けても Gradle は zip を作るので、6 つすべてに入っているかを調べる。
      - name: zip に言語サーバーが入っているかを調べる
        working-directory: editors/rider/build/distributions
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for zip in shaderlyn-rider-*-*.zip; do
            case "${zip}" in
              *-windows-*) server=shaderlyn-lsp.exe ;;
              *) server=shaderlyn-lsp ;;
            esac
            if ! unzip -Z1 "${zip}" | grep -q "/server/${server}\$"; then
              echo "::error::${zip} に server/${server} が入っていません。"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "${count}" -ne 6 ]; then
            echo "::error::zip が 6 つではありません (${count} 個)。"
            exit 1
          fi

      # 作者の署名を付ける (付けないと、インストールのときに IDE が警告を出す)。
      # シークレットは CONTRIBUTING.md の手順で作った証明書 (chain.crt) と秘密鍵 (private_encrypted.pem) の中身とパスフレーズ。
      # 署名の処理は CI でも使い捨ての鍵で動かしている (ci.yml)。
      - name: zip に署名する
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_CHAIN}" ] || [ -z "${PRIVATE_KEY}" ] || [ -z "${PRIVATE_KEY_PASSWORD}" ]; then
            echo "::warning::署名のシークレットが無いので、Rider の zip に署名していません。"
            exit 0
          fi
          printf '%s\n' "${CERTIFICATE_CHAIN}" > "${RUNNER_TEMP}/chain.crt"
          printf '%s\n' "${PRIVATE_KEY}" > "${RUNNER_TEMP}/private.pem"
          tools/rider/sign-zips.sh editors/rider/build/distributions "${RUNNER_TEMP}/chain.crt" "${RUNNER_TEMP}/private.pem"
          rm -f "${RUNNER_TEMP}/private.pem"

      - uses: actions/upload-artifact@v7
        with:
          name: shaderlyn-rider
          path: editors/rider/build/distributions/shaderlyn-rider-*-*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 自作ルール用の NuGet パッケージを nuget.org へ公開する。
  #
  # バイナリがすべて組めてから出す。nuget.org に出したパッケージは消せない
  # (一覧から隠せるだけ) ので、どこかのプラットフォームで落ちたリリースのパッケージを残さない。
  # 途中で失敗して流し直したときのために、出し済みのものは飛ばす (--skip-duplicate)。
  #
  # API キーは保存せず、Trusted Publishing で受け取る。GitHub が発行する OIDC トークンを
  # nuget.org が検証し、1 時間だけ有効なキーを返す。nuget.org 側のポリシーは
  # リポジトリとこのファイル名 (release.yml) に結びついているので、ファイル名を変えたらポリシーも直す。
  # ------------------------------------------------------------------
  nuget:
    name: NuGet パッケージを公開する
    needs: [build, visualstudio, rider]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: パッケージを作る
        shell: bash
        run: >
          dotnet pack
          --configuration Release
          --output artifacts/packages
          -p:Version="${GITHUB_REF_NAME#v}"

      # キーは 1 時間で切れるので、作り終えてから受け取る。
      # user は nuget.org のプロフィール名で、メールアドレスではない。
      - name: nuget.org から一時的な API キーを受け取る
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 公開する
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          # .snupkg は同じフォルダーにあれば一緒に送られる。
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "${NUGET_API_KEY}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  release:
    name: リリースを作る
    needs: [build, nuget, visualstudio, rider]
    runs-on: ubuntu-latest

    # VS Code Marketplace へは、PAT を保存せず Trusted Publishing で公開する (id-token)。
    # Marketplace の発行者のポリシーは、リポジトリとこのファイル名 (release.yml) に結びついている。
    permissions:
      contents: write
      id-token: write

    steps:
      # 言語サーバーだけの artifact (lsp-*) は配布物に入れない。
      - uses: actions/download-artifact@v8
        with:
          pattern: shaderlyn-*
          path: artifacts
          merge-multiple: true

      # 取り違えは配布後に気づくと直すのが面倒なので、
      # 公開する前に何が入っているかをログへ残す。
      - name: 配布物を一覧する
        run: ls -lR artifacts

      - name: チェックサムを作る
        working-directory: artifacts
        run: sha256sum shaderlyn-* > SHA256SUMS.txt

      # 拡張は OS と CPU の組ごとに別の vsix なので、作ったものをそのまま送る (--packagePath)。
      # Marketplace に出したバージョンは上書きできないので、全プラットフォームが組めたこのジョブで出す。
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Azure DevOps のグローバル PAT は 2026-12-01 に廃止される。--oidc は GitHub の OIDC トークンを
      # Marketplace の一時的な資格情報に換える (15 分で切れ、1 つのトークンは 1 回しか換えられない)。
      - name: VS Code Marketplace に公開する
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @vscode/vsce publish \
            --packagePath artifacts/shaderlyn-vscode-*.vsix \
            --oidc

      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases
          path: source

      # 本文は、リリースの概要の下に、GitHub が作る PR の一覧が付く。
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: source/docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ------------------------------------------------------------------
  # Visual Studio Marketplace へ Visual Studio 拡張を公開する。
  #
  # VsixPublisher.exe は Windows でしか動かない。Trusted Publishing のトークンを受け付けるものは
  # Microsoft.VSSDK.BuildTools 18.11 以降に入っているので、ビルドに使うバージョン (17.14) とは別に取得する。
  # 同じバージョンを出し直すと上書きになる。
  # ------------------------------------------------------------------
  publish-visualstudio:
    name: Visual Studio Marketplace に公開する
    needs: release
    runs-on: windows-2025

    permissions:
      contents: read
      id-token: write

    env:
      VSSDK_BUILDTOOLS_VERSION: "18.12.1606"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: shaderlyn-visualstudio
          path: artifacts

      - name: VsixPublisher を取得する
        shell: pwsh
        run: |
          $version = $env:VSSDK_BUILDTOOLS_VERSION
          $package = Join-Path $env:RUNNER_TEMP "vssdk.zip"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.vssdk.buildtools/$version/microsoft.vssdk.buildtools.$version.nupkg" -OutFile $package
          Expand-Archive $package -DestinationPath (Join-Path $env:RUNNER_TEMP "vssdk")

      # VsixPublisher 18.12.1606 の -oidc は、トークンを換える要求に api-version を付けないので
      # Marketplace に断られる (VsixPub0047、microsoft/vsmarketplace#2310)。
      # 直ったバージョンが出るまでは、vsce と同じ要求で自分で換えて、-personalAccessToken で渡す。
      # 換えた資格情報は 15 分で切れる。
      - name: 公開する
        shell: pwsh
        working-directory: editors/visualstudio/marketplace
        run: |
          $manifest = Get-Content publishManifest.json -Raw | ConvertFrom-Json
          $oidc = Invoke-RestMethod -Method Get `
            -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"; Accept = 'application/json' }
          Write-Output "::add-mask::$($oidc.value)"
          $exchange = Invoke-RestMethod -Method Post `
            -Uri 'https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1' `
            -Headers @{ Authorization = "FederatedToken $($oidc.value)"; Accept = 'application/json'; 'X-Market-CI-Provider' = 'github-actions' } `
            -ContentType 'application/json' `
            -Body (@{ publisherName = $manifest.publisher } | ConvertTo-Json)
          Write-Output "::add-mask::$($exchange.credential)"

          # Marketplace の概要は、拡張機能の README (英語) と同じ内容にする。
          # Marketplace は相対リンクを書き換えないので、README のリンクは絶対 URL で書く。
          Copy-Item ../README.md overview.md -Force

          $publisher = Join-Path $env:RUNNER_TEMP "vssdk\tools\vssdk\bin\VsixPublisher.exe"
          & $publisher publish `
            -payload "${{ github.workspace }}\artifacts\shaderlyn-visualstudio.vsix" `
            -publishManifest publishManifest.json `
            -personalAccessToken $exchange.credential
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ------------------------------------------------------------------
  # JetBrains Marketplace へ Rider プラグインを公開する。
  #
  # 最初のバージョンは Marketplace の Web から手で上げる決まりなので、
  # リポジトリの secret (JETBRAINS_MARKETPLACE_TOKEN) を設定するまでは何もしない。
  # 組ごとの zip を、それぞれ 1 つの更新として送る (Marketplace は plugin.xml の OS と CPU の依存で振り分ける)。
  # 公開は審査の後になる。
  # ------------------------------------------------------------------
  publish-rider:
    name: JetBrains Marketplace に公開する
    needs: release
    runs-on: ubuntu-latest

    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

    steps:
      - uses: actions/download-artifact@v8
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        with:
          name: shaderlyn-rider
          path: artifacts

      - name: 公開する
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          for zip in artifacts/shaderlyn-rider-*-*.zip; do
            echo "送る: ${zip}"
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${JETBRAINS_MARKETPLACE_TOKEN}" \
              --form xmlId=dev.shaderlyn \
              --form "file=@${zip}" \
              https://plugins.jetbrains.com/api/updates/upload
            echo
          done

      - name: 公開しなかったことを知らせる
        if: env.JETBRAINS_MARKETPLACE_TOKEN == ''
        run: echo "::notice::JETBRAINS_MARKETPLACE_TOKEN が設定されていないので、JetBrains Marketplace には公開していません。"
